name: Packages

# Builds @wyndbase/wql and @wyndbase/sdk from the private mirror and serves the
# tarballs from GitHub Pages: haandev.github.io/labs/packages/<name>-<version>.tgz
# This repo is public, so build logs are withheld; only verdicts are printed.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Mirror branch or tag to build'
        required: true
        default: 'dev'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: packages
  cancel-in-progress: false

env:
  BASE_URL: https://haandev.github.io/labs/packages
  MIRROR: git@github.com:haandev/wyndb-mirror.git

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.pack.outputs.published }}
    env:
      CI: 'true'
      SRC: /tmp/wyndb-src
      LOGS: /tmp/wyndb-logs
    steps:
      - uses: actions/checkout@v4

      - name: Clone the mirror
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
          REF: ${{ inputs.ref || 'dev' }}
        run: |
          mkdir -p ~/.ssh "$LOGS"
          printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
          GIT_SSH_COMMAND='ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes' \
            git clone -q --depth 1 --branch "$REF" "$MIRROR" "$SRC"
          echo "built from $REF @ $(git -C "$SRC" rev-parse --short HEAD)"

      - name: Anything new?
        id: check
        run: |
          sha=$(git -C "$SRC" rev-parse --short=7 HEAD)
          last=$(jq -r '.latest.commit // ""' packages/built.json 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$last" ]; then
            echo "$sha is already built"; echo "new=0" >> "$GITHUB_OUTPUT"
          else
            echo "$sha is new (last built: ${last:-none})"; echo "new=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.new == '1'
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == '1'
        with:
          node-version: 24

      - name: Build
        if: steps.check.outputs.new == '1'
        working-directory: /tmp/wyndb-src
        run: |
          step() { local name=$1; shift; "$@" > "$LOGS/$name.log" 2>&1 || { echo "::error::$name failed (log withheld: public repo)"; exit 1; }; echo "$name ok"; }
          step install bun install --frozen-lockfile
          step typegen bun run typegen
          step wql bash -c 'cd packages/wql && bun run build'
          step sdk bash -c 'cd packages/sdk && bun run build'

      - name: Strip source maps, pin the sdk to this build's wql
        if: steps.check.outputs.new == '1'
        working-directory: /tmp/wyndb-src
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          for dist in packages/wql/dist packages/sdk/dist; do
            find "$dist" -name '*.map' -delete
            find "$dist" -name '*.js' -exec sed -i '/^\/\/# sourceMappingURL=/d' {} +
          done
          wql=$(jq -r .version packages/wql/dist/package.json)
          m=packages/sdk/dist/package.json
          jq --arg url "$BASE_URL/wyndbase-wql-$wql.$SHA.tgz" \
            'if .dependencies["@wyndbase/wql"] then .dependencies["@wyndbase/wql"] = $url else . end' "$m" > "$m.tmp" && mv "$m.tmp" "$m"

      - name: Refuse anything that carries source
        if: steps.check.outputs.new == '1'
        working-directory: /tmp/wyndb-src
        run: |
          for dist in packages/wql/dist packages/sdk/dist; do
            if find "$dist" -name '*.map' | grep -q . || grep -rqE 'sourcesContent|sourceMappingURL=' "$dist"; then
              echo "::error::$dist still carries source maps"; exit 1
            fi
            leaked=$(cd "$dist" && npm pack --dry-run --json 2>/dev/null | jq -r '.[0].files[].path | select(test("\\.map$") or (test("\\.tsx?$") and (test("\\.d\\.ts$") | not)))')
            if [ -n "$leaked" ]; then echo "::error::$dist would ship source files"; exit 1; fi
          done
          echo "no source in either tarball"

      # <name>-<version>.<sha>.tgz is written once; <name>-<version>.tgz always follows the latest build.
      - name: Pack
        id: pack
        if: steps.check.outputs.new == '1'
        env:
          SHA: ${{ steps.check.outputs.sha }}
          REF: ${{ inputs.ref || 'dev' }}
        run: |
          mkdir -p /tmp/wyndb-pack
          for p in wql sdk; do
            v=$(jq -r .version "$SRC/packages/$p/dist/package.json")
            pinned="wyndbase-$p-$v.$SHA.tgz"
            if [ -f "packages/$pinned" ]; then echo "::error::$pinned already exists"; exit 1; fi
            name=$(cd "$SRC/packages/$p/dist" && npm pack --json --pack-destination /tmp/wyndb-pack 2>/dev/null | jq -r '.[0].filename')
            cp "/tmp/wyndb-pack/$name" "packages/$pinned"
            cp "/tmp/wyndb-pack/$name" "packages/wyndbase-$p-$v.tgz"
            echo "packed $pinned and wyndbase-$p-$v.tgz"
            declare "v_$p=$v"
          done
          prev=$(cat packages/built.json 2>/dev/null || echo '{}')
          jq -n --argjson prev "$prev" --arg commit "$SHA" --arg ref "$REF" --arg date "$(date -u +%FT%TZ)" \
            --arg wql "$v_wql" --arg sdk "$v_sdk" \
            '{commit:$commit, ref:$ref, date:$date, wql:$wql, sdk:$sdk} as $b | {latest:$b, history:([$b] + ($prev.history // []))}' \
            > packages/built.json
          echo "published=$SHA" >> "$GITHUB_OUTPUT"

      - name: Index and commit
        if: steps.pack.outputs.published != ''
        run: |
          jq -r --arg base "$BASE_URL" '
            def link($f): "<a href=\"\($f)\">\($f)</a>";
            "<!doctype html><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">",
            "<title>wyndbase packages</title><style>body{font:15px/1.6 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem}code{background:#f3f3f3;padding:.1rem .3rem;border-radius:4px;word-break:break-all}td{padding:.2rem .6rem .2rem 0;vertical-align:top}</style>",
            "<h1>wyndbase packages</h1>",
            "<h2>Latest</h2><p>Always the newest build of <code>\(.latest.ref)</code> (\(.latest.commit), \(.latest.date)). Its content changes, so lockfiles pinning it will break on rebuild.</p>",
            "<p><code>bun add \($base)/wyndbase-sdk-\(.latest.sdk).tgz</code></p>",
            "<h2>Pinned builds</h2><p>Never change once written; safe for lockfiles.</p><table>",
            (.history[] | "<tr><td>\(.date[0:16])</td><td>\(.commit)</td><td>\(link("wyndbase-sdk-\(.sdk).\(.commit).tgz"))<br>\(link("wyndbase-wql-\(.wql).\(.commit).tgz"))</td></tr>"),
            "</table>"
          ' packages/built.json > packages/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages
          git commit -q -m "packages: build ${{ steps.pack.outputs.published }}"
          git push -q

  deploy:
    needs: build
    if: always() && (github.event_name == 'push' || needs.build.outputs.published != '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
